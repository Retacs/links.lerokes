<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Socials</title>
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --btn-bg: #09090b;
            --btn-border: #222222;
            --btn-hover: #151518;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Marketplace & Brief Colors */
            --promo-purple: #b057f8;
            --promo-bg: #151515;
            --paper-bg: #d1b98b;
            --paper-border: #3a2818;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-base);
            overflow-x: hidden;
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto; 
            padding: 40px 20px 120px 20px; box-sizing: border-box; 
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 35px; text-align: center;
        }
        
        .profile-avatar {
            width: 96px; height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px;
            border: 2px solid #333;
        }
        
        .profile-name {
            font-size: 1.6rem; margin: 0 0 4px 0; color: #fff;
            letter-spacing: 0.05em; 
        }
        
        .profile-bio {
            font-size: 0.95rem; font-weight: normal; color: var(--text-muted); margin: 0;
        }

        /* --- LINKS (CLEAN) --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; background: var(--btn-bg); color: #fff; text-decoration: none;
            padding: 16px 20px; border-radius: 8px; font-size: 1rem;
            transition: all 0.15s ease; box-sizing: border-box; 
            border: 1px solid var(--btn-border);
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: #3f3f46;
        }

        .btn-left { display: flex; align-items: center; flex: 1; }
        .btn-center { flex: 2; text-align: center; }
        .btn-right { flex: 1; display: flex; justify-content: flex-end; }

        .link-icon { width: 20px; height: 20px; fill: #fff; }
        .dots-icon { width: 20px; height: 20px; fill: #444; transition: fill 0.15s ease;}

        .link-btn:hover .dots-icon { fill: #888; }

        /* --- MINECRAFT BRIEF / WIDGET UNTEN RECHTS --- */
        .mc-letter-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Das geschlossene Brief-Icon (Sieht aus wie ein Minecraft-Item) */
        .mc-letter-icon-btn {
            background-color: var(--paper-bg);
            border: 3px solid var(--paper-border);
            width: 55px; height: 55px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.9), inset 2px 2px 0px rgba(255,255,255,0.4);
            transition: transform 0.1s ease;
            transform: rotate(-4deg);
        }
        
        .mc-letter-icon-btn:hover {
            transform: scale(1.1) rotate(0deg);
        }

        .mc-letter-icon-btn img {
            width: 32px; height: 32px;
            image-rendering: pixelated;
        }

        /* Das große, aufgeklappte Marketplace-Popup */
        .mc-promo-popup {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 260px;
            background-color: var(--promo-bg);
            border: 3px solid #333;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.95), 0px 0px 25px rgba(176, 87, 248, 0.2);
            border-radius: 6px;
            display: flex; flex-direction: column; gap: 12px; text-align: center;
            /* Animation fürs Auf- und Zuklappen */
            transform-origin: bottom right;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Klasse, wenn der Brief geöffnet ist */
        .mc-letter-container.open .mc-promo-popup {
            transform: scale(1) rotate(-2deg);
            opacity: 1;
            pointer-events: auto;
        }

        .mc-promo-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 2px;
        }

        .mc-promo-tag {
            background: rgba(176, 87, 248, 0.15); color: var(--promo-purple);
            font-size: 0.65rem; padding: 3px 6px; border: 1px solid var(--promo-purple);
            letter-spacing: 0.05em;
        }

        .mc-close-btn {
            background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer; padding: 0; line-height: 1;
        }
        .mc-close-btn:hover { color: #fff; }

        .mc-promo-title {
            color: var(--promo-purple); font-size: 1.2rem; margin: 0;
            line-height: 1.2; text-shadow: 2px 2px 0px #000;
        }

        .mc-promo-desc {
            color: #bbb; font-size: 0.8rem; margin: 0; line-height: 1.4; 
            font-family: "Segoe UI", sans-serif;
        }

        .mc-promo-btn {
            background-color: var(--promo-purple); 
            color: #fff; text-decoration: none;
            padding: 9px 14px; font-size: 0.9rem; 
            border: 2px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
            display: flex; align-items: center; justify-content: center; 
            width: 100%; box-sizing: border-box;
            text-shadow: 1px 1px 0px #000;
            transition: 0.1s;
            margin-top: 4px;
        }
        
        .mc-promo-btn:hover { 
            background-color: #c073ff; 
            transform: translate(-2px, -2px); 
            box-shadow: 5px 5px 0px rgba(0,0,0,1); 
        }
        
        .mc-promo-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 1px 1px 0px rgba(0,0,0,1); 
        }

        /* Click Particles */
        .click-particle { position: fixed; width: 6px; height: 6px; background: #fff; pointer-events: none; z-index: 999999; animation: particlePop 0.4s ease-out forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            .mc-letter-container { bottom: 15px; right: 15px; }
            .mc-promo-popup { width: 220px; bottom: 65px; padding: 15px; }
            .mc-promo-title { font-size: 1rem; }
            .mc-promo-desc { font-size: 0.75rem; }
            .mc-promo-btn { font-size: 0.85rem; padding: 7px; }
        }
    </style>
</head>
<body>

    <!-- AUFKLAPPBARES MINECRAFT BRIEF-WIDGET -->
    <div class="mc-letter-container" id="letterContainer">
        <!-- Das aufgeklappte Marketplace-Popup -->
        <div class="mc-promo-popup">
            <div class="mc-promo-header">
                <span class="mc-promo-tag mc-font">Event</span>
                <button class="mc-close-btn" onclick="toggleLetter(event)">&times;</button>
            </div>
            <h3 class="mc-promo-title mc-font">Nicht verpassen</h3>
            <p class="mc-promo-desc">Unterstütze das Team! Bewirb dich jetzt als Twitch Mod oder VIP.</p>
            <a href="https://lerokes.com" class="mc-promo-btn mc-font">Jetzt Bewerben</a>
        </div>

        <!-- Das geschlossene Brief-Icon zum Anklicken -->
        <div class="mc-letter-icon-btn" onclick="toggleLetter(event)" title="Brief öffnen">
            <!-- Minecraft Brief/Paper Icon -->
            <img src="https://minecraft.wiki/images/Paper_JE2_BE2.png" alt="Brief" onerror="this.src='https://minotar.net/helm/MHF_Book/32.png'">
        </div>
    </div>

    <script>
        // Funktion zum Auf- und Zuklappen des Briefes
        window.toggleLetter = function(e) {
            e.stopPropagation();
            const container = document.getElementById('letterContainer');
            container.classList.toggle('open');
        }

        // Automatisches Schließen, wenn man irgendwoanders hinklickt
        document.addEventListener('click', (e) => {
            const container = document.getElementById('letterContainer');
            if (!container.contains(e.target)) {
                container.classList.remove('open');
            }
        });

        window.triggerParticles = function(e) {
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 400);
            }
        };
    </script>
