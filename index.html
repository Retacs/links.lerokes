<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Socials</title>
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --btn-bg: #09090b;
            --btn-border: #222222;
            --btn-hover: #18181b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Minecraft Nether Popup Colors */
            --ad-purple: #b057f8;
            --ad-bg: #111111;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-base);
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto; 
            padding: 40px 20px 120px 20px; box-sizing: border-box; 
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 35px; text-align: center;
        }
        
        .profile-avatar {
            width: 96px; height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        
        .profile-name {
            font-size: 1.6rem; margin: 0 0 4px 0; color: #fff;
            letter-spacing: 0.05em; 
        }
        
        .profile-bio {
            font-size: 0.95rem; font-weight: normal; color: var(--text-muted); margin: 0;
        }

        /* --- LINKS (FLAT & CLEAN) --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; background: var(--btn-bg); color: #fff; text-decoration: none;
            padding: 18px 20px; border-radius: 4px; font-size: 1rem;
            transition: background 0.1s ease, border-color 0.1s ease; box-sizing: border-box; 
            border: 1px solid var(--btn-border);
        }

        /* Kein Bounce mehr, nur noch cleaner Farbwechsel */
        .link-btn:hover {
            background: var(--btn-hover);
            border-color: #444;
        }

        .btn-left { display: flex; align-items: center; flex: 1; }
        .btn-center { flex: 2; text-align: center; }
        .btn-right { flex: 1; display: flex; justify-content: flex-end; }

        .link-icon { width: 20px; height: 20px; fill: #fff; }
        .dots-icon { width: 20px; height: 20px; fill: #444; transition: fill 0.1s ease;}

        .link-btn:hover .dots-icon { fill: #888; }

        /* --- MINECRAFT SCHIEFES POPUP (BEWERBUNG) --- */
        .ad-popup {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 220px;
            background: var(--ad-bg);
            /* Echter Minecraft Look: Harter dicker Rand, blockig, fetter Schatten */
            border: 4px solid #000;
            border-radius: 0;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 6px 6px 0px rgba(0,0,0,1), inset 2px 2px 0px rgba(255,255,255,0.05);
            transform: rotate(-3deg);
            z-index: 999999;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
        }

        .ad-popup:hover {
            transform: rotate(0deg) translate(-2px, -2px);
            box-shadow: 8px 8px 0px rgba(0,0,0,1), inset 2px 2px 0px rgba(255,255,255,0.05);
        }

        .ad-title {
            color: var(--ad-purple); font-size: 1.15rem; margin: 0;
            line-height: 1.2; text-shadow: 2px 2px 0px #000;
        }

        .ad-desc {
            color: #aaa; font-size: 0.85rem; margin: 0; line-height: 1.4; font-family: "Segoe UI", sans-serif;
        }

        .ad-btn {
            background: var(--ad-purple); color: #fff; text-decoration: none;
            padding: 8px 12px; font-size: 0.9rem; border: 2px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,1); display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box;
            transition: 0.1s; margin-top: 5px; text-shadow: 1px 1px 0px #000;
        }
        
        .ad-btn:hover { filter: brightness(1.2); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px rgba(0,0,0,1); }
        .ad-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px rgba(0,0,0,1); }

        /* Click Particles (Dezent) */
        .click-particle { position: fixed; width: 6px; height: 6px; background: #fff; pointer-events: none; z-index: 999999; animation: particlePop 0.4s ease-out forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            .ad-popup {
                bottom: 15px;
                right: 15px;
                width: 180px;
                padding: 12px;
                border-width: 3px;
                box-shadow: 4px 4px 0px rgba(0,0,0,1);
            }
            .ad-title { font-size: 0.95rem; text-shadow: 1px 1px 0px #000;}
            .ad-desc { font-size: 0.75rem; }
            .ad-btn { font-size: 0.8rem; padding: 6px; }
        }
    </style>
</head>

    <script>
        window.triggerParticles = function(e) {
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 400);
            }
        };
    </script>
