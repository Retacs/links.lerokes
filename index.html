<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Links</title>
    
    <!-- Die offizielle, dicke Minecraft Überschriften-Schriftart -->
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #111111; 
            --bg-surface: #1e1e1e;
            --bg-card: #27272a;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --accent-main: #b057f8; 
            
            /* Social Colors */
            --twitch-color: #9146FF;
            --tiktok-color: #ff0050;
            --discord-color: #5865F2;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #555; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-main); }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); background-color: #111; 
            overflow-x: hidden; 
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HINTERGRUND EFFEKTE --- */
        .background-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: #09090b; 
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.9) 100%), 
                url('https://lerokes.com/background.jpg'); /* Zieht sich das Bild von deiner Hauptseite */
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            z-index: -3; 
        }

        .background-swirl {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(circle at 50% 100%, rgba(148, 0, 211, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -2; pointer-events: none;
        }

        .background-particles {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                radial-gradient(3px 3px at 30px 50px, rgba(218, 112, 214, 0.8) 50%, transparent 100%),
                radial-gradient(4px 4px at 140px 120px, rgba(176, 87, 248, 0.9) 50%, transparent 100%),
                radial-gradient(3px 3px at 280px 80px, rgba(232, 162, 255, 0.7) 50%, transparent 100%),
                radial-gradient(4px 4px at 450px 190px, rgba(148, 0, 211, 0.8) 50%, transparent 100%),
                radial-gradient(3px 3px at 650px 90px, rgba(176, 87, 248, 0.8) 50%, transparent 100%),
                radial-gradient(4px 4px at 850px 140px, rgba(218, 112, 214, 0.7) 50%, transparent 100%),
                radial-gradient(3px 3px at 1050px 60px, rgba(232, 162, 255, 0.9) 50%, transparent 100%);
            background-repeat: repeat; background-size: 1200px 350px;
            animation: floatNetherParticles 15s linear infinite;
            pointer-events: none; z-index: -1;
        }

        @keyframes floatNetherParticles {
            0% { background-position: 0px 0px; opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { background-position: 0px -350px; opacity: 0.8; }
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            max-width: 680px; margin: 0 auto; padding: 60px 20px 40px 20px;
            box-sizing: border-box; position: relative; z-index: 1;
            min-height: 100vh;
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; text-align: center;
        }
        
        .profile-avatar {
            width: 130px; height: 130px; border: 4px solid #000;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6); margin-bottom: 20px;
            background-color: #000; object-fit: cover;
            image-rendering: pixelated; /* Für Minecraft-Köpfe wichtig */
        }
        
        .profile-name {
            font-size: 2.8rem; margin: 0 0 5px 0; color: #fff;
            text-shadow: 4px 4px 0px #000; letter-spacing: 0.05em;
        }
        
        .profile-bio {
            font-size: 1.2rem; font-weight: 600; color: var(--text-muted); margin: 0;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- LINKS --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 20px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: center; position: relative;
            width: 100%; background: var(--bg-card); color: #fff; text-decoration: none;
            padding: 22px 20px; border: 4px solid #000; font-size: 1.4rem;
            box-shadow: inset 4px 4px 0px rgba(255,255,255,0.05), 6px 6px 0px rgba(0,0,0,0.6);
            transition: all 0.15s ease; box-sizing: border-box; overflow: hidden;
            letter-spacing: 0.05em; text-shadow: 2px 2px 0px #000;
        }

        .link-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: inset 4px 4px 0px rgba(255,255,255,0.05), 8px 8px 0px rgba(0,0,0,0.8);
            background: #3f3f46;
        }

        .link-btn:active {
            transform: translate(6px, 6px);
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.4);
        }

        .link-icon {
            position: absolute; left: 25px; width: 28px; height: 28px;
            filter: drop-shadow(2px 2px 0px #000);
        }

        /* Spezifische Button-Hover-Farben für das gewisse Etwas */
        .link-btn.twitch:hover { border-color: var(--twitch-color); box-shadow: inset 4px 4px 0px rgba(255,255,255,0.05), 8px 8px 0px rgba(145, 70, 255, 0.4); }
        .link-btn.tiktok:hover { border-color: var(--tiktok-color); box-shadow: inset 4px 4px 0px rgba(255,255,255,0.05), 8px 8px 0px rgba(255, 0, 80, 0.4); }
        .link-btn.discord:hover { border-color: var(--discord-color); box-shadow: inset 4px 4px 0px rgba(255,255,255,0.05), 8px 8px 0px rgba(88, 101, 242, 0.4); }
        .link-btn.bewerbung { background: var(--accent-main); }
        .link-btn.bewerbung:hover { background: #c073ff; border-color: #fff; box-shadow: inset 4px 4px 0px rgba(255,255,255,0.2), 8px 8px 0px rgba(0,0,0,0.8); }

        /* --- FOOTER --- */
        .footer {
            margin-top: auto; padding-top: 50px; text-align: center;
        }
        .footer a {
            color: var(--text-muted); text-decoration: none; font-size: 1rem;
            margin: 0 10px; font-weight: bold; letter-spacing: 0.05em; transition: 0.2s;
        }
        .footer a:hover { color: #fff; text-shadow: 1px 1px 0px #000;}

        /* Click Particles */
        .click-particle { position: fixed; width: 14px; height: 14px; pointer-events: none; z-index: 9999; border: 2px solid #000; animation: particlePop 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0) rotate(var(--rot)); opacity: 0; } }
    </style>
</head>
<body>

    <div class="background-container"></div>
    <div class="background-swirl"></div>
    <div class="background-particles"></div>

    <div id="linktree-wrapper">
        
        <div class="profile-section">
            <!-- Dein Minecraft Skin Kopf (ersetze 'Lero' durch deinen genauen MC Namen, falls der Kopf abweichen sollte) -->
            <img src="https://minotar.net/helm/Lero/150.png" alt="Lerokes" class="profile-avatar">
            <h1 class="profile-name mc-font">Lerokes</h1>
            <p class="profile-bio">Twitch Streamer & Content Creator</p>
        </div>

        <div class="links-container">
            
            <a href="https://twitch.tv/lerokes" target="_blank" class="link-btn twitch mc-font" onclick="triggerParticles(event, '#9146FF')">
                <svg class="link-icon" fill="#fff" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                Twitch
            </a>

            <a href="https://tiktok.com/@lyricsifyy" target="_blank" class="link-btn tiktok mc-font" onclick="triggerParticles(event, '#ff0050')">
                <svg class="link-icon" fill="#fff" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                TikTok
            </a>

            <!-- Hier kannst du deinen Discord Invite-Link reinpacken -->
            <a href="#" target="_blank" class="link-btn discord mc-font" onclick="triggerParticles(event, '#5865F2')">
                <svg class="link-icon" fill="#fff" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Discord Server
            </a>

            <!-- Der wichtigste Button ist farblich hervorgehoben -->
            <a href="https://lerokes.com" class="link-btn bewerbung mc-font" onclick="triggerParticles(event, '#b057f8')">
                <svg class="link-icon" fill="#fff" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                Ins Team Bewerben
            </a>

        </div>

        <div class="footer mc-font">
            <a href="https://lerokes.com/impressum.html" target="_blank">Impressum</a>
            <a href="https://lerokes.com/datenschutz.html" target="_blank">Datenschutz</a>
        </div>
        
    </div>

    <script>
        // Klick-Partikel Script, das du schon von der Bewerbungsseite kennst
        window.triggerParticles = function(e, color) {
            // Nur generieren wenn auch wirklich mit der Maus/Finger geklickt wurde
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.backgroundColor = color;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 30 + Math.random() * 60;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = Math.random() * 180 + 'deg';
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.setProperty('--rot', rot);
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 500);
            }
        };
    </script>
</body>
</html>
