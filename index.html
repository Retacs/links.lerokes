<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Socials</title>
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --btn-bg: #09090b;
            --btn-border: #222222;
            --btn-hover: #151518;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Minecraft Book/Letter Colors */
            --paper-bg: #d1b98b;
            --paper-border: #3a2818;
            --paper-text: #111111;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-base);
            /* Optional: Ein dezenter Minecraft-Crosshair-Cursor für Desktop */
            cursor: crosshair;
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto; 
            padding: 40px 20px 120px 20px; box-sizing: border-box; 
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 35px; text-align: center;
        }
        
        .profile-avatar {
            width: 96px; height: 96px; 
            /* Blockig, falls du den echten MC Vibe willst, ansonsten 50% für rund */
            border-radius: 8px; 
            object-fit: cover; 
            margin-bottom: 15px;
            border: 2px solid #333;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }
        
        .profile-name {
            font-size: 1.6rem; margin: 0 0 4px 0; color: #fff;
            letter-spacing: 0.05em; 
        }
        
        .profile-bio {
            font-size: 0.95rem; font-weight: normal; color: var(--text-muted); margin: 0;
        }

        /* --- LINKS (CLEAN & INVENTORY SLOT HOVER) --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; background: var(--btn-bg); color: #fff; text-decoration: none;
            padding: 18px 20px; border-radius: 0px; /* Eckig für Minecraft Vibe */
            font-size: 1rem;
            transition: all 0.1s ease; box-sizing: border-box; 
            border: 2px solid var(--btn-border);
            cursor: pointer;
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: #444;
            /* Minecraft Inventory Slot Effekt beim Drübergehen */
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.9), inset -3px -3px 0px rgba(255,255,255,0.05);
        }

        .btn-left { display: flex; align-items: center; flex: 1; }
        .btn-center { flex: 2; text-align: center; }
        .btn-right { flex: 1; display: flex; justify-content: flex-end; }

        .link-icon { width: 20px; height: 20px; fill: #fff; }
        .dots-icon { width: 20px; height: 20px; fill: #444; transition: fill 0.1s ease;}

        .link-btn:hover .dots-icon { fill: #888; }

        /* --- MINECRAFT BRIEF POPUP (ADBLOCKER SICHER) --- */
        .mc-letter-popup {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 240px;
            background-color: var(--paper-bg);
            border: 4px solid var(--paper-border);
            padding: 18px 15px;
            box-sizing: border-box;
            /* Papier-Textur Schatten & harter Minecraft Drop-Shadow */
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.15), inset 2px 2px 0px rgba(255,255,255,0.3), 8px 8px 0px rgba(0,0,0,1);
            transform: rotate(-3deg);
            z-index: 999999;
            transition: transform 0.15s ease;
            display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center;
        }

        .mc-letter-popup:hover {
            transform: rotate(0deg) translate(-2px, -2px);
        }

        .mc-letter-title {
            color: var(--paper-text); font-size: 1.1rem; margin: 0;
            text-decoration: underline; text-decoration-thickness: 2px;
            letter-spacing: 0.05em;
        }

        .mc-letter-desc {
            color: #2a1f14; font-size: 0.8rem; margin: 0; line-height: 1.5; 
        }

        /* Echter klassischer Minecraft GUI Button */
        .mc-letter-btn {
            background-color: #c6c6c6; 
            color: #000; text-decoration: none;
            padding: 10px 12px; font-size: 0.9rem; 
            /* Typische MC Button Ränder (Weiß oben/links, Grau unten/rechts) */
            border: 2px solid #000;
            border-top-color: #ffffff;
            border-left-color: #ffffff;
            border-bottom-color: #555555;
            border-right-color: #555555;
            display: flex; align-items: center; justify-content: center; 
            width: 100%; box-sizing: border-box;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
            cursor: pointer;
        }
        
        .mc-letter-btn:hover { 
            background-color: #90a8ff; /* Bläulicher Hover-Effekt wie im Game */
        }
        
        .mc-letter-btn:active { 
            /* Button drückt sich optisch rein */
            border-top-color: #555555;
            border-left-color: #555555;
            border-bottom-color: #ffffff;
            border-right-color: #ffffff;
            background-color: #7b94ff;
        }

        /* Click Particles */
        .click-particle { position: fixed; width: 6px; height: 6px; background: #fff; pointer-events: none; z-index: 999999; animation: particlePop 0.4s ease-out forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            .mc-letter-popup {
                bottom: 15px;
                right: 15px;
                width: 200px;
                padding: 12px;
                border-width: 3px;
                box-shadow: inset -2px -2px 0px rgba(0,0,0,0.15), inset 2px 2px 0px rgba(255,255,255,0.3), 5px 5px 0px rgba(0,0,0,1);
            }
            .mc-letter-title { font-size: 0.95rem; }
            .mc-letter-desc { font-size: 0.75rem; }
            .mc-letter-btn { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- MINECRAFT BRIEF POPUP (Umbenannt für Adblocker) -->
    <div class="mc-letter-popup">
        <h3 class="mc-letter-title mc-font">Nicht verpassen</h3>
        <p class="mc-letter-desc mc-font">Unterstütze das Team! Bewirb dich jetzt als Twitch Mod oder VIP.</p>
        <a href="https://lerokes.com" class="mc-letter-btn mc-font">Jetzt Bewerben</a>
    </div>

    <script>
        window.triggerParticles = function(e) {
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 400);
            }
        };
    </script>
