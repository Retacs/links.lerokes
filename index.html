<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Socials</title>
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --btn-bg: #09090b;
            --btn-border: #222222;
            --btn-hover: #151518;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Marketplace Promo Colors */
            --promo-purple: #b057f8;
            --promo-bg: #151515;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-base);
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto; 
            padding: 40px 20px 120px 20px; box-sizing: border-box; 
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 35px; text-align: center;
        }
        
        .profile-avatar {
            width: 96px; height: 96px; 
            border-radius: 50%; /* Wieder perfekt rund */
            object-fit: cover; 
            margin-bottom: 15px;
            border: 2px solid #333;
        }
        
        .profile-name {
            font-size: 1.6rem; margin: 0 0 4px 0; color: #fff;
            letter-spacing: 0.05em; 
        }
        
        .profile-bio {
            font-size: 0.95rem; font-weight: normal; color: var(--text-muted); margin: 0;
        }

        /* --- LINKS (CLEAN & MINIMALISTISCH) --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 12px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; background: var(--btn-bg); color: #fff; text-decoration: none;
            padding: 16px 20px; border-radius: 8px; /* Leichte, moderne Rundung */
            font-size: 1rem;
            transition: all 0.15s ease; box-sizing: border-box; 
            border: 1px solid var(--btn-border);
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: #3f3f46;
        }

        .btn-left { display: flex; align-items: center; flex: 1; }
        .btn-center { flex: 2; text-align: center; }
        .btn-right { flex: 1; display: flex; justify-content: flex-end; }

        .link-icon { width: 20px; height: 20px; fill: #fff; }
        .dots-icon { width: 20px; height: 20px; fill: #444; transition: fill 0.15s ease;}

        .link-btn:hover .dots-icon { fill: #888; }

        /* --- MARKETPLACE PROMO POPUP (ADBLOCKER SICHER) --- */
        .mc-promo-popup {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 230px;
            background-color: var(--promo-bg);
            border: 2px solid #333;
            padding: 18px 15px;
            box-sizing: border-box;
            /* Harter dunkler Schatten + dezenter lila Glow wie im Marketplace */
            box-shadow: 0px 10px 25px rgba(0,0,0,0.9), 0px 0px 15px rgba(176, 87, 248, 0.15);
            transform: rotate(-3deg);
            z-index: 999999;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center;
            border-radius: 6px;
        }

        .mc-promo-popup:hover {
            transform: rotate(0deg) scale(1.02);
            box-shadow: 0px 15px 35px rgba(0,0,0,1), 0px 0px 25px rgba(176, 87, 248, 0.3);
            border-color: #555;
        }

        .mc-promo-title {
            color: var(--promo-purple); font-size: 1.15rem; margin: 0;
            line-height: 1.2; text-shadow: 2px 2px 0px #000;
        }

        .mc-promo-desc {
            color: #ccc; font-size: 0.8rem; margin: 0; line-height: 1.4; 
            font-family: "Segoe UI", sans-serif;
        }

        .mc-promo-btn {
            background-color: var(--promo-purple); 
            color: #fff; text-decoration: none;
            padding: 8px 12px; font-size: 0.9rem; 
            border: 2px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
            display: flex; align-items: center; justify-content: center; 
            width: 100%; box-sizing: border-box;
            text-shadow: 1px 1px 0px #000;
            transition: 0.1s;
            margin-top: 5px;
        }
        
        .mc-promo-btn:hover { 
            background-color: #c073ff; 
            transform: translate(-2px, -2px); 
            box-shadow: 5px 5px 0px rgba(0,0,0,1); 
        }
        
        .mc-promo-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 1px 1px 0px rgba(0,0,0,1); 
        }

        /* Click Particles */
        .click-particle { position: fixed; width: 6px; height: 6px; background: #fff; pointer-events: none; z-index: 999999; animation: particlePop 0.4s ease-out forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            .mc-promo-popup {
                bottom: 15px;
                right: 15px;
                width: 190px;
                padding: 15px;
            }
            .mc-promo-title { font-size: 0.95rem; }
            .mc-promo-desc { font-size: 0.75rem; }
            .mc-promo-btn { font-size: 0.8rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- MARKETPLACE PROMO POPUP -->
    <div class="mc-promo-popup">
        <h3 class="mc-promo-title mc-font">Nicht verpassen</h3>

        <a href="https://lerokes.com" class="mc-promo-btn mc-font">Jetzt Bewerben</a>
    </div>

    <script>
        window.triggerParticles = function(e) {
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 20 + Math.random() * 30;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 400);
            }
        };
    </script>

</html>
