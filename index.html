<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lerokes | Socials</title>
    
    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #000000;
            --btn-bg: #09090b;
            --btn-border: #1f1f22;
            --btn-hover: #151518;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Marketplace Promo Colors */
            --promo-purple: #b057f8;
            --promo-yellow: #FFD700;
            --promo-bg: #2b2b2b; /* Das typische dunkle Grau aus dem Marketplace */
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; min-height: 100vh; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            background-color: var(--bg-base);
            overflow-x: hidden;
        }

        .mc-font {
            font-family: 'Minecraft', sans-serif;
            text-transform: uppercase;
            font-weight: normal;
        }

        /* --- HAUPT-LAYOUT --- */
        #linktree-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; margin: 0 auto; 
            padding: 40px 20px 120px 20px; box-sizing: border-box; 
        }

        /* --- PROFIL BEREICH --- */
        .profile-section {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 35px; text-align: center;
        }
        
        .profile-avatar {
            width: 96px; height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px;
            border: 2px solid #333;
        }
        
        .profile-name {
            font-size: 1.6rem; margin: 0 0 4px 0; color: #fff;
            letter-spacing: 0.05em; 
        }
        
        .profile-bio {
            font-size: 0.95rem; font-weight: normal; color: var(--text-muted); margin: 0;
        }

        /* --- LINKS (ABSOLUT CLEAN & MINIMALISTISCH) --- */
        .links-container {
            width: 100%; display: flex; flex-direction: column; gap: 10px;
        }

        .link-btn {
            display: flex; align-items: center; justify-content: space-between; 
            width: 100%; background: var(--btn-bg); color: #fff; text-decoration: none;
            padding: 18px 20px; border-radius: 6px; font-size: 1rem;
            transition: all 0.15s ease; box-sizing: border-box; 
            border: 1px solid var(--btn-border);
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: #3f3f46;
        }

        .btn-left { display: flex; align-items: center; flex: 1; }
        .btn-center { flex: 2; text-align: center; }
        .btn-right { flex: 1; display: flex; justify-content: flex-end; }

        .link-icon { width: 20px; height: 20px; fill: #fff; }
        .dots-icon { width: 20px; height: 20px; fill: #444; transition: fill 0.15s ease;}

        .link-btn:hover .dots-icon { fill: #888; }


        /* --- SCHWEBENDER BRIEF & MARKETPLACE POPUP --- */
        .mc-widget-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* 1. Der reine, schwebende Minecraft-Brief (OHNE Box) */
        .mc-floating-letter {
            width: 48px; height: 48px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Gibt dem Briefbild einen eigenen, freigestellten Schatten */
            filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.8));
            transform: rotate(-5deg);
        }
        
        .mc-floating-letter:hover {
            transform: scale(1.15) rotate(0deg);
        }

        .mc-floating-letter img {
            width: 100%; height: 100%;
            image-rendering: pixelated; /* Erhält den Pixel-Look */
        }

        /* 2. Die aufklappende Marketplace Anzeige */
        .mc-promo-card {
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 280px;
            background-color: var(--promo-bg);
            padding: 15px;
            box-sizing: border-box;
            border-radius: 2px;
            /* Der fette gelbe Glow aus dem Marketplace */
            box-shadow: 0px 0px 50px rgba(255, 215, 0, 0.4), 0px 10px 20px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 12px;
            
            /* Animation fürs Aufklappen */
            transform-origin: bottom right;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Klasse "open", die durch JavaScript hinzugefügt wird */
        .mc-widget-container.open .mc-promo-card {
            transform: scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Kopfbereich mit Schließen-Button */
        .mc-promo-header {
            display: flex; justify-content: flex-end; align-items: center;
            margin-bottom: -5px;
        }
        .mc-close-btn {
            background: none; border: none; color: #888; font-size: 1.4rem; cursor: pointer; padding: 0; line-height: 1; transition: color 0.1s;
        }
        .mc-close-btn:hover { color: #fff; }

        /* Das Bild in der Anzeige (wie das Superman-Bild) */
        .mc-promo-image {
            width: 100%; height: 90px;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #1a1a1a;
            overflow: hidden;
        }
        .mc-promo-image img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Titel (Gelb) & Text */
        .mc-promo-title {
            color: var(--promo-yellow); font-size: 1.3rem; margin: 0;
            line-height: 1.1; text-shadow: 2px 2px 0px rgba(0,0,0,0.6);
        }

        .mc-promo-desc {
            color: #d1d1d1; font-size: 0.85rem; margin: 0; line-height: 1.4; 
            font-family: "Segoe UI", sans-serif;
        }

        /* Button (Lila Nether Style) */
        .mc-promo-btn {
            background-color: var(--promo-purple); 
            color: #fff; text-decoration: none;
            padding: 10px 15px; font-size: 0.95rem; 
            border: 2px solid #000;
            box-shadow: 3px 3px 0px rgba(0,0,0,1);
            display: flex; align-items: center; justify-content: center; 
            width: 100%; box-sizing: border-box;
            text-shadow: 1px 1px 0px #000;
            transition: 0.1s;
            margin-top: 5px;
        }
        
        .mc-promo-btn:hover { 
            background-color: #c073ff; 
            transform: translate(-2px, -2px); 
            box-shadow: 5px 5px 0px rgba(0,0,0,1); 
        }
        
        .mc-promo-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 1px 1px 0px rgba(0,0,0,1); 
        }

        /* Click Particles */
        .click-particle { position: fixed; width: 6px; height: 6px; background: #fff; pointer-events: none; z-index: 999999; animation: particlePop 0.4s ease-out forwards; }
        @keyframes particlePop { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            .mc-widget-container { bottom: 20px; right: 20px; }
            .mc-promo-card { width: 240px; bottom: 55px; padding: 12px; }
            .mc-promo-image { height: 75px; }
            .mc-promo-title { font-size: 1.1rem; }
            .mc-promo-desc { font-size: 0.8rem; }
            .mc-promo-btn { font-size: 0.85rem; padding: 8px; }
            .mc-floating-letter { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <!-- AUFKLAPPBARES WIDGET (Nur noch der reine Brief und die Marketplace Karte) -->
    <div class="mc-widget-container" id="widgetContainer">
        
        <!-- Das aufgeklappte Marketplace-Popup -->
        <div class="mc-promo-card">
            <div class="mc-promo-header">
                <button class="mc-close-btn" onclick="toggleLetter(event)">&times;</button>
            </div>
            
            <!-- Der Platzhalter für ein Bild im Marketplace-Stil -->
            <div class="mc-promo-image">
                <img src="profil.png" alt="Promo" onerror="this.src='https://minotar.net/helm/Lero/150.png'">
            </div>

            <h3 class="mc-promo-title mc-font">NICHT VERPASSEN</h3>
            <p class="mc-promo-desc">Unterstütze das Team! Bewirb dich jetzt als Twitch Mod oder VIP.</p>
            <a href="https://lerokes.com" class="mc-promo-btn mc-font">JETZT BEWERBEN</a>
        </div>

        <!-- Der geschlossene schwebende Brief -->
        <div class="mc-floating-letter" onclick="toggleLetter(event)" title="Brief öffnen">
            <img src="https://minecraft.wiki/images/Paper_JE2_BE2.png" alt="Brief">
        </div>
        
    </div>

    <script>
        // Funktion zum Auf- und Zuklappen der Anzeige
        window.toggleLetter = function(e) {
            e.stopPropagation();
            const container = document.getElementById('widgetContainer');
            container.classList.toggle('open');
        }

        // Schließt das Fenster, wenn man woanders hin klickt
        document.addEventListener('click', (e) => {
            const container = document.getElementById('widgetContainer');
            if (!container.contains(e.target)) {
                container.classList.remove('open');
            }
        });

        window.triggerParticles = function(e) {
            if (!e.clientX && !e.changedTouches) return; 
            
            const x = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
            const y = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 15 + Math.random() * 25;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 400);
            }
        };
    </script>
